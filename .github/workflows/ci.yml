name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint . --ext .js,.jsx --max-warnings=50
      - run: npx prettier --check "App.js" "app/**/*.{js,jsx}" "babel.config.js" "app.json" "package.json"

  backend:
    name: Backend install & smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start API and hit health
        run: |
          node index.js &
          sleep 2
          curl -fsS http://localhost:9000/health
          curl -fsS http://localhost:9000/api/listings | head -c 100
